[project]
name = "xsupport-backend"
version = "0.1.0"
description = "XSupport AI backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "bcrypt>=4.1",
  "pyjwt>=2.8",
  "scikit-learn>=1.5",
  "numpy>=1.26",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# Optional: real sentence-embedding model (large download). Without it, retrieval falls back to local LSA.
embeddings = ["sentence-transformers>=3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in argument defaults is the intended pattern
exclude = ["alembic/versions"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
