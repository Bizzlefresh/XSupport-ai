name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: xsupport, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: xsupport }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xsupport" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      DATABASE_URL: postgresql+psycopg://xsupport:ci-only@localhost:5432/xsupport
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      # Verifies migrations on real PostgreSQL: up, down, up, and no model/migration drift.
      - run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check
      - run: python ../scripts/seed_database.py

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
