services:
  db:
    # pgvector image so Phase 4 can add vector search without changing infrastructure.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xsupport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-xsupport}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xsupport}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-xsupport}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-xsupport}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TEAMDYNAMIX_ENABLED: ${TEAMDYNAMIX_ENABLED:-false}
      TEAMDYNAMIX_READ_ONLY: ${TEAMDYNAMIX_READ_ONLY:-true}
      TEAMDYNAMIX_BASE_URL: ${TEAMDYNAMIX_BASE_URL:-}
      TEAMDYNAMIX_APP_ID: ${TEAMDYNAMIX_APP_ID:-}
      TEAMDYNAMIX_TOKEN: ${TEAMDYNAMIX_TOKEN:-}
      EXTERNAL_LLM_ENABLED: ${EXTERNAL_LLM_ENABLED:-false}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-lsa}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_TECH_PASSWORD: ${SEED_TECH_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
